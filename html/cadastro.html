<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Olivermontes</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet"
      href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>

<body>

    <header>
	      <img src="../imagens/logo.png"
          alt="Logo da Olivermontes"
          width="150">
        <h1>Olivermontes</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projeto.html">Projetos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h2>Cadastro</h2>

        <p>
            Preencha os dados abaixo para realizar seu cadastro.
        </p>

        <form action="#" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo:</label><br>
                    <input type="text"
                           id="nome"
                           name="nome"
                           required>
                </p>

                <p>
                    <label for="cpf">CPF:</label><br>
                    <input type="text"
                           id="cpf"
                           name="cpf"
                           placeholder="000.000.000-00"
                           maxlength="14"
                           required>
                </p>

                <p>
                    <label for="nascimento">Data de nascimento:</label><br>
                    <input type="date"
                           id="nascimento"
                           name="nascimento"
                           required>
                </p>

            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="seuemail@exemplo.com"
                           required>
                </p>

                <p>
                    <label for="telefone">Telefone:</label><br>
                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           placeholder="(38) 99999-9999"
                           maxlength="15"
                           required>
                </p>

            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <p>
                    <label for="endereco">Endereço:</label><br>
                    <input type="text"
                           id="endereco"
                           name="endereco"
                           required>
                </p>

                <p>
                    <label for="cidade">Cidade:</label><br>
                    <input type="text"
                           id="cidade"
                           name="cidade"
                           required>
                </p>

                <p>
                    <label for="estado">Estado:</label><br>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione o estado</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="BA">Bahia</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="PR">Paraná</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="RS">Rio Grande do Sul</option>
                    </select>
                </p>

                <p>
                    <label for="cep">CEP:</label><br>
                    <input type="text"
                           id="cep"
                           name="cep"
                           placeholder="39400-000"
                           maxlength="9"
                           required>
                </p>

            </fieldset>

            <p>
                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar formulário</button>
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Olivermontes - Todos os direitos reservados.</p>
    </footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script type="module" src="../js/app.js"></script>
</body>
</html>
