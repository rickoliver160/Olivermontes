<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Olivermontes</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>

<body>

    <a href="#conteudo-principal" class="skip-link">
        Ir para o conteúdo principal
    </a>

    <header>
        <img src="../imagens/logo.png"
             alt="Logo da Olivermontes"
             width="150">

        <h1>Olivermontes</h1>

        <nav aria-label="Navegação principal">
            <ul>
                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="projeto.html">Projetos</a>
                </li>

                <li>
                    <a href="cadastro.html"
                       aria-current="page">
                        Cadastro
                    </a>
                </li>
            </ul>
        </nav>
        <section class="controles-acessibilidade"
         aria-label="Opções de acessibilidade">

    <button type="button" id="btn-tema-escuro">
        Modo escuro
    </button>

    <button type="button" id="btn-alto-contraste">
        Alto contraste
    </button>

    <button type="button" id="btn-tema-normal">
        Tema normal
    </button>

</section>
    </header>

    <main id="conteudo-principal">

        <h2>Cadastro</h2>

        <p id="descricao-cadastro">
            Preencha os dados abaixo para realizar seu cadastro.
        </p>

        <form action="#"
              method="post"
              aria-describedby="descricao-cadastro">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo:</label><br>

                    <input type="text"
                           id="nome"
                           name="nome"
                           autocomplete="name"
                           required
                           aria-required="true"
                           aria-describedby="erro-nome">

                    <span id="erro-nome"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

                <p>
                    <label for="cpf">CPF:</label><br>

                    <input type="text"
                           id="cpf"
                           name="cpf"
                           placeholder="000.000.000-00"
                           maxlength="14"
                           inputmode="numeric"
                           autocomplete="off"
                           required
                           aria-required="true"
                           aria-describedby="erro-cpf">

                    <span id="erro-cpf"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

                <p>
                    <label for="nascimento">Data de nascimento:</label><br>

                    <input type="date"
                           id="nascimento"
                           name="nascimento"
                           autocomplete="bday"
                           required
                           aria-required="true"
                           aria-describedby="erro-nascimento">

                    <span id="erro-nascimento"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <p>
                    <label for="email">E-mail:</label><br>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="seuemail@exemplo.com"
                           autocomplete="email"
                           required
                           aria-required="true"
                           aria-describedby="erro-email">

                    <span id="erro-email"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

                <p>
                    <label for="telefone">Telefone:</label><br>

                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           placeholder="(38) 99999-9999"
                           maxlength="15"
                           inputmode="tel"
                           autocomplete="tel"
                           required
                           aria-required="true"
                           aria-describedby="erro-telefone">

                    <span id="erro-telefone"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <p>
                    <label for="endereco">Endereço:</label><br>

                    <input type="text"
                           id="endereco"
                           name="endereco"
                           autocomplete="street-address"
                           required
                           aria-required="true"
                           aria-describedby="erro-endereco">

                    <span id="erro-endereco"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

                <p>
                    <label for="cidade">Cidade:</label><br>

                    <input type="text"
                           id="cidade"
                           name="cidade"
                           autocomplete="address-level2"
                           required
                           aria-required="true"
                           aria-describedby="erro-cidade">

                    <span id="erro-cidade"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

                <p>
                    <label for="estado">Estado:</label><br>

                    <select id="estado"
                            name="estado"
                            autocomplete="address-level1"
                            required
                            aria-required="true"
                            aria-describedby="erro-estado">

                        <option value="">Selecione o estado</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="BA">Bahia</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="PR">Paraná</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="RS">Rio Grande do Sul</option>
                    </select>

                    <span id="erro-estado"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

                <p>
                    <label for="cep">CEP:</label><br>

                    <input type="text"
                           id="cep"
                           name="cep"
                           placeholder="39400-000"
                           maxlength="9"
                           inputmode="numeric"
                           autocomplete="postal-code"
                           required
                           aria-required="true"
                           aria-describedby="erro-cep">

                    <span id="erro-cep"
                          class="mensagem-erro"
                          aria-live="polite"></span>
                </p>

            </fieldset>

            <p>
                <button type="submit">
                    Enviar cadastro
                </button>

                <button type="reset">
                    Limpar formulário
                </button>
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Olivermontes - Todos os direitos reservados.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module" src="../js/app.js"></script>

</body>

</html>
